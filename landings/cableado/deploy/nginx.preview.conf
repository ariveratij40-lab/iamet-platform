server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /api/ { default_type application/json; return 503 '{"status":"unavailable"}'; }
  location / { try_files $uri $uri/ =404; }
}
