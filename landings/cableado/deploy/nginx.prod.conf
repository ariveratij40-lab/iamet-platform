server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        default_type application/json;
        return 503 '{"status":"unavailable"}';
    }

    # Astro fingerprints compiled assets. Public images use stable filenames.
    location ^~ /_astro/ {
        expires 365d;
        try_files $uri =404;
    }

    location ~* ^/(images|brand)/.+\.(avif|webp|png|jpe?g|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
