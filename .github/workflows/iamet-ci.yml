name: IAMET CI

on:
  pull_request:
    branches:
      - feature/iamet-ionos-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate IAMET
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_APP_URL=https://staging.iamet.mx \
            -f deployment/ionos-production/Dockerfile \
            -t iamet-ci:${{ github.sha }} \
            .

      - name: Smoke test Docker image
        timeout-minutes: 2
        run: |
          container=$(docker run -d -p 127.0.0.1:3000:3000 \
            -e SEED_CALENDAR_DATA=false \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            "iamet-ci:$GITHUB_SHA")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/health | jq -e '.ok == true' >/dev/null; then
              exit 0
            fi
            [[ $(docker inspect -f '{{.State.Running}}' "$container") == true ]] || break
            sleep 1
          done
          docker logs "$container"
          exit 1
