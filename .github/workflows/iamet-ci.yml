name: IAMET CI

on:
  pull_request:
    branches:
      - feature/iamet-ionos-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate IAMET
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test landing capture
        run: pnpm exec vitest run server/landing-capture.test.ts server/admin-password-reset.test.ts

      - name: Check email worker syntax
        run: node --check deployment/cableado-mail/worker.mjs

      - name: Build application
        run: pnpm build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_APP_URL=https://staging.iamet.mx \
            -f deployment/ionos-production/Dockerfile \
            -t iamet-ci:${{ github.sha }} \
            .

      - name: Setup Node.js for Astro landing
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate static landing
        working-directory: landings/cableado
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_CAPTURE_ENABLED: "false"
          PUBLIC_PRIVACY_URL: https://privacidad.iamet.mx/
        run: |
          npm ci
          npm test
          npm run build
