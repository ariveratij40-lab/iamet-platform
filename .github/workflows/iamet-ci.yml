name: IAMET CI

on:
  pull_request:
    branches:
      - feature/iamet-ionos-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate IAMET
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_APP_URL=https://staging.iamet.mx \
            -f deployment/ionos-production/Dockerfile \
            -t iamet-ci:${{ github.sha }} \
            .
