name: IAMET CI

on:
  pull_request:
    branches:
      - feature/iamet-ionos-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iamet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate IAMET
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iamet_test
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iamet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:ci_only@127.0.0.1:5432/iamet_test
          SKIP_LIVE_PROVIDER_TESTS: "true"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f deployment/vps-v2/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO verticals (slug, name)
          SELECT slug, slug FROM unnest(ARRAY[
            'infraestructura', 'seguridad', 'rfid', 'software-ia',
            'servicios-administrados', 'educacion', 'compliance', 'control-acceso', 'cctv'
          ]) AS catalog(slug);
          SQL
          JWT_SECRET="$(openssl rand -hex 32)" pnpm test
      - name: Test landing capture
        run: pnpm exec vitest run server/landing-capture.test.ts server/admin-password-reset.test.ts

      - name: Check email worker syntax
        run: node --check deployment/cableado-mail/worker.mjs

      - name: Build application
        run: pnpm build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_APP_URL=https://staging.iamet.mx \
            -f deployment/ionos-production/Dockerfile \
            -t iamet-ci:${{ github.sha }} \
            .

      - name: Smoke test Docker image
        timeout-minutes: 2
        run: |
          container=$(docker run -d -p 127.0.0.1:3000:3000 \
            -e SEED_CALENDAR_DATA=false \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            "iamet-ci:$GITHUB_SHA")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/health | jq -e '.ok == true' >/dev/null; then
              exit 0
            fi
            [[ $(docker inspect -f '{{.State.Running}}' "$container") == true ]] || break
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Setup Node.js for Astro landing
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate static landing
        working-directory: landings/cableado
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_CAPTURE_ENABLED: "false"
          PUBLIC_PRIVACY_URL: https://privacidad.iamet.mx/
        run: |
          npm ci
          npm test
          npm run build
