# Initial validation on the test VPS. Keep noindex until public-launch review.
server {
    listen 80;
    server_name cableadoestructurado.iamet.mx;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://cableadoestructurado.iamet.mx$request_uri; }
}
server {
    listen 443 ssl;
    server_name cableadoestructurado.iamet.mx;
    ssl_certificate /etc/letsencrypt/live/cableadoestructurado.iamet.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cableadoestructurado.iamet.mx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1m;
    location = / {
        proxy_pass http://iamet_v2_app_staging:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /soluciones/cableado-estructurado { return 302 /; }
    location = /soluciones/cableado-estructurado/gracias {
        proxy_pass http://iamet_v2_app_staging:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/(assets|images|products|partners|fonts|brand)/ {
        proxy_pass http://iamet_v2_app_staging:3000;
        proxy_set_header Host $host;
    }
    location /api/trpc/ {
        proxy_pass http://iamet_v2_app_staging:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/profile {
        proxy_pass http://iamet_v2_app_staging:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 302 https://iamet.mx$request_uri; }
}
