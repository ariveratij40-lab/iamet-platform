version: "3.9"

# ─── Red externa del VPS ──────────────────────────────────────────────────────
# Requiere: docker network create infra_network (ya existente en el VPS)
networks:
  infra_network:
    external: true

# ─── Volúmenes persistentes ───────────────────────────────────────────────────
volumes:
  iamet_pg_staging:
    driver: local
  iamet_redis_staging:
    driver: local

services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  iamet_db_staging:
    image: postgres:16-alpine
    container_name: iamet_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iamet_staging}
      POSTGRES_USER: ${POSTGRES_USER:-iamet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - iamet_pg_staging:/var/lib/postgresql/data
    networks:
      - infra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iamet} -d ${POSTGRES_DB:-iamet_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  iamet_redis_staging:
    image: redis:7-alpine
    container_name: iamet_redis_staging
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - iamet_redis_staging:/data
    networks:
      - infra_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Aplicación IAMET ───────────────────────────────────────────────────────
  iamet_app_staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: iamet_app_staging:latest
    container_name: iamet_app_staging
    restart: unless-stopped
    depends_on:
      iamet_db_staging:
        condition: service_healthy
      iamet_redis_staging:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-iamet}:${POSTGRES_PASSWORD}@iamet_db_staging:5432/${POSTGRES_DB:-iamet_staging}
      REDIS_URL: redis://:${REDIS_PASSWORD}@iamet_redis_staging:6379
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: ${VITE_APP_ID}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID}
      OWNER_NAME: ${OWNER_NAME}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL}
      VITE_APP_URL: ${VITE_APP_URL:-https://staging.iamet.mx}
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      - infra_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
