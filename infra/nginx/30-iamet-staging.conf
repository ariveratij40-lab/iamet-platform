# ─── IAMET Platform — Nginx Fase B (HTTP + HTTPS) ────────────────────────────
# Usar DESPUÉS de obtener el certificado SSL con Certbot webroot (Fase A).
# Ubicar en: /opt/infra/nginx/sites-enabled/30-iamet-staging.conf
#
# Requiere que existan:
#   /opt/infra/certbot/conf/live/staging.iamet.mx/fullchain.pem
#   /opt/infra/certbot/conf/live/staging.iamet.mx/privkey.pem

server {
    listen 80;
    server_name staging.iamet.mx;

    # Certbot webroot ACME challenge (renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.iamet.mx;

    # ─── SSL (Certbot webroot) ────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/staging.iamet.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.iamet.mx/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/staging.iamet.mx.access.log;
    error_log  /var/log/nginx/staging.iamet.mx.error.log;

    # ─── Tamaño máximo de body (para uploads) ─────────────────────────────────
    client_max_body_size 20M;

    # ─── Proxy a la aplicación Node.js ────────────────────────────────────────
    # El contenedor iamet_app_staging expone el puerto 3000 en la red infra_network
    location / {
        proxy_pass         http://iamet_app_staging:3000;
        proxy_http_version 1.1;

        # WebSocket / SSE support (live chat, streaming)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }

    # ─── Assets estáticos con caché agresivo ──────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass         http://iamet_app_staging:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }
}
