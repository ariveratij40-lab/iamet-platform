# ─── IAMET Platform — Nginx Fase A (HTTP solamente) ──────────────────────────
# Usar ANTES de obtener el certificado SSL por primera vez.
# Ubicar en: /opt/infra/nginx/sites-enabled/30-iamet-staging.conf
#
# Propósito:
#   1. Servir el ACME challenge de Certbot webroot.
#   2. Redirigir el resto del tráfico HTTP → HTTPS (o proxy temporal).
#
# Después de obtener el certificado, reemplazar por 30-iamet-staging.conf (Fase B).

server {
    listen 80;
    server_name staging.iamet.mx;

    # Certbot webroot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS (el certificado aún no existe,
    # pero el redirect es inofensivo; el navegador recibirá un error SSL
    # solo si intenta acceder antes de que el cert esté listo).
    location / {
        return 301 https://$host$request_uri;
    }
}
