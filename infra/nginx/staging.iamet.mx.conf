# ─── IAMET Platform — Nginx Reverse Proxy (Staging) ──────────────────────────
# Ubicar en: /opt/infra/nginx/conf.d/staging.iamet.mx.conf
# Requiere: certbot SSL ya configurado para staging.iamet.mx

server {
    listen 80;
    server_name staging.iamet.mx;

    # Redirigir todo HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot ACME challenge (para renovación automática)
    location /.well-known/acme-challenge/ {
        root /opt/infra/certbot/www;
    }
}

server {
    listen 443 ssl;
    server_name staging.iamet.mx;

    # ─── SSL (Certbot) ────────────────────────────────────────────────────────
    ssl_certificate     /opt/infra/certbot/conf/live/staging.iamet.mx/fullchain.pem;
    ssl_certificate_key /opt/infra/certbot/conf/live/staging.iamet.mx/privkey.pem;
    include             /opt/infra/certbot/conf/options-ssl-nginx.conf;
    ssl_dhparam         /opt/infra/certbot/conf/ssl-dhparams.pem;

    # ─── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/staging.iamet.mx.access.log;
    error_log  /var/log/nginx/staging.iamet.mx.error.log;

    # ─── Tamaño máximo de body (para uploads) ─────────────────────────────────
    client_max_body_size 20M;

    # ─── Proxy a la aplicación Node.js ────────────────────────────────────────
    # El contenedor iamet_app_staging expone el puerto 3000 en la red infra_network
    location / {
        proxy_pass         http://iamet_app_staging:3000;
        proxy_http_version 1.1;

        # WebSocket support (para SSE / live chat)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Buffer para respuestas grandes
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }

    # ─── Archivos estáticos del frontend (Vite build) ─────────────────────────
    # Caché agresivo para assets con hash en el nombre
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass         http://iamet_app_staging:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires            1y;
        add_header         Cache-Control "public, immutable";
    }
}
